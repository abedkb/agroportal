name: Agromet Pipeline Run

# Two ways to run this, neither needs a server:
#   1. Automatically, once a day (the schedule below)
#   2. Manually, any time -- go to this repo's "Actions" tab, pick this
#      workflow, click "Run workflow". That's the button.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'Sources to update (noaa, chirps, or noaa,chirps)'
        default: 'noaa,chirps'
        required: false
      first_run_vars:
        description: 'Only used the very first time (no data cached yet): which NOAA variables to backfill'
        default: 'shum,air'
        required: false
      first_run_levels:
        description: 'Only used the very first time: which pressure levels to backfill'
        default: '850'
        required: false
      first_run_start:
        description: 'Only used the very first time: backfill start year (keep this small -- a free GitHub Actions runner has a 60-minute limit)'
        default: '2015'
        required: false
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC daily = 07:00 East Africa Time

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Restore whatever was cached from previous runs BEFORE doing any
      # work, so "update" only has to fetch what's genuinely new (not
      # redownload everything -- GitHub Actions runners are wiped clean
      # after each run, so without this the whole point of "incremental"
      # update would be lost).
      - name: Restore cached data from previous runs
        uses: actions/cache@v4
        with:
          path: pipeline/NOAA
          key: agromet-noaa-data-${{ github.run_id }}
          restore-keys: |
            agromet-noaa-data-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cdo nco

      - name: Install Python dependencies
        run: |
          pip install --break-system-packages \
            xarray matplotlib cartopy numpy pandas scipy requests

      - name: Run update (or first-time backfill if nothing's cached yet)
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          SOURCES="${{ inputs.sources }}"
          SOURCES="${SOURCES:-noaa,chirps}"

          # "update" only ever EXTENDS data that already exists -- it's not
          # designed to do a first-time backfill, and correctly refuses to
          # try (see agro_pipeline.sh's run_update). So: detect that case
          # here and run a genuinely small, scoped "all" first to seed the
          # cache, THEN switch to "update" from the next run onward.
          #
          # Keep this scoped deliberately small -- a free GitHub Actions
          # runner has a 60-minute limit, and the full catalog (100+
          # variable/level combinations, full history) would blow well
          # past that. Widening coverage later (new variables/levels) is
          # a separate, manual "all --vars ... --levels ..." run any time
          # you want -- "update" will never add combinations that were
          # never backfilled in the first place, only extend ones that
          # already exist.
          if [[ ! -d "NOAA/aggregated" ]]; then
            echo "No cached data found -- this looks like the first run. Doing a small scoped backfill first."
            bash agro_pipeline.sh all \
              --vars "${{ inputs.first_run_vars || 'shum,air' }}" \
              --levels "${{ inputs.first_run_levels || '850' }}" \
              --start "${{ inputs.first_run_start || '2015' }}" \
              --end "$(date +%Y)" \
              --skip-surface --skip-static-plots \
              $([ "$SOURCES" == "noaa" ] && echo "--skip-chirps")
          else
            echo "Existing cached data found -- running incremental update."
            bash agro_pipeline.sh update --sources "$SOURCES"
          fi
      # No explicit "save" step needed: actions/cache@v4 automatically
      # saves the path above under this run's key once the job finishes
      # successfully, so the NEXT run's restore-keys match finds it.
