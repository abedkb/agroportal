name: Test Trigger Config

on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'Sources to update (noaa, chirps, or noaa,chirps)'
        default: 'noaa,chirps'
        required: false
      first_run_vars:
        description: 'Only used the very first time: which NOAA variables to backfill'
        default: 'shum,air'
        required: false
      first_run_levels:
        description: 'Only used the very first time: which pressure levels to backfill'
        default: '850'
        required: false
      first_run_start:
        description: 'Only used the very first time: backfill start year'
        default: '2015'
        required: false
  schedule:
    - cron: '0 4 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: echo "hello from a workflow with the same trigger config as update-agromet-data.yml"
